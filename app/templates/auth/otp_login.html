<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Login — IT Help Desk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">🛡️</div>
      <div class="auth-title">OTP Login</div>
      <div class="auth-subtitle">Passwordless sign-in with one-time password</div>
    </div>

    <!-- Step 1: Enter email -->
    <div id="step1">
      <form id="otp-request-form">
        <div class="form-group">
          <label class="form-label">Email Address <span class="required">*</span></label>
          <div class="input-icon-wrap">
            <i class="input-icon fa-solid fa-envelope"></i>
            <input type="email" class="form-control" id="otp-email" placeholder="you@company.com" required autofocus>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-full" id="send-otp-btn">
          <span id="send-spinner" class="spinner hidden" style="width:16px;height:16px;"></span>
          <i class="fa-solid fa-paper-plane" id="send-icon"></i>
          Send OTP
        </button>
      </form>
    </div>

    <!-- Step 2: Enter OTP -->
    <div id="step2" class="hidden">
      <div style="text-align:center; margin-bottom:20px; padding:16px; background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.3); border-radius:var(--radius-sm);">
        <i class="fa-solid fa-circle-check" style="color:#10b981; font-size:24px; margin-bottom:8px; display:block;"></i>
        <div style="font-size:13px; color:var(--text-secondary);">OTP sent to <strong id="sent-to-email" style="color:var(--text-primary);"></strong></div>
        <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">Valid for 5 minutes. Check server logs in dev mode.</div>
      </div>

      <form id="otp-verify-form">
        <div class="form-group">
          <label class="form-label" style="text-align:center; display:block;">Enter 6-digit OTP</label>
          <div style="display:flex; gap:8px; justify-content:center; margin-bottom:20px;">
            <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]"
                   style="width:48px;height:56px;text-align:center;font-size:22px;font-weight:700;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);outline:none;transition:var(--transition);">
            <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]"
                   style="width:48px;height:56px;text-align:center;font-size:22px;font-weight:700;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);outline:none;transition:var(--transition);">
            <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]"
                   style="width:48px;height:56px;text-align:center;font-size:22px;font-weight:700;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);outline:none;transition:var(--transition);">
            <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]"
                   style="width:48px;height:56px;text-align:center;font-size:22px;font-weight:700;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);outline:none;transition:var(--transition);">
            <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]"
                   style="width:48px;height:56px;text-align:center;font-size:22px;font-weight:700;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);outline:none;transition:var(--transition);">
            <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]"
                   style="width:48px;height:56px;text-align:center;font-size:22px;font-weight:700;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);outline:none;transition:var(--transition);">
          </div>
          <!-- Countdown -->
          <div style="text-align:center; font-size:12px; color:var(--text-muted); margin-bottom:16px;">
            Expires in <span id="countdown" style="color:var(--priority-high); font-weight:700;">5:00</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full" id="verify-btn">
          <span id="verify-spinner" class="spinner hidden" style="width:16px;height:16px;"></span>
          <i class="fa-solid fa-shield-halved" id="verify-icon"></i>
          Verify OTP
        </button>

        <button type="button" onclick="resendOtp()" class="btn btn-secondary w-full" style="margin-top:8px;" id="resend-btn">
          <i class="fa-solid fa-rotate"></i> Resend OTP
        </button>
      </form>
    </div>

    <p style="text-align:center; margin-top:20px; font-size:13px; color:var(--text-muted);">
      <a href="{{ url_for('web.login') }}" style="color:var(--brand-purple-glow);text-decoration:none;">
        <i class="fa-solid fa-arrow-left" style="font-size:11px;"></i> Back to Login
      </a>
    </p>
  </div>
</div>

<div id="toast-container"></div>

<script>
  if (localStorage.getItem('hd-theme') === 'light') document.body.classList.add('light-mode');
  let currentEmail = '';
  let countdownInterval;

  // OTP digit inputs — auto-advance
  const digits = document.querySelectorAll('.otp-digit');
  digits.forEach((digit, idx) => {
    digit.addEventListener('focus', () => digit.style.borderColor = 'var(--brand-purple)');
    digit.addEventListener('blur', () => digit.style.borderColor = 'var(--border)');
    digit.addEventListener('input', (e) => {
      const val = e.target.value.replace(/[^0-9]/g, '');
      digit.value = val;
      if (val && idx < digits.length - 1) digits[idx + 1].focus();
    });
    digit.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !digit.value && idx > 0) digits[idx - 1].focus();
    });
    digit.addEventListener('paste', (e) => {
      const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
      [...pasted].forEach((ch, i) => { if (digits[idx + i]) digits[idx + i].value = ch; });
      e.preventDefault();
    });
  });

  function getOtp() {
    return [...digits].map(d => d.value).join('');
  }

  function startCountdown(seconds = 300) {
    clearInterval(countdownInterval);
    const el = document.getElementById('countdown');
    let remaining = seconds;
    countdownInterval = setInterval(() => {
      remaining--;
      const m = Math.floor(remaining / 60);
      const s = remaining % 60;
      el.textContent = `${m}:${s.toString().padStart(2, '0')}`;
      if (remaining <= 60) el.style.color = 'var(--priority-critical)';
      if (remaining <= 0) { clearInterval(countdownInterval); el.textContent = 'Expired'; }
    }, 1000);
  }

  document.getElementById('otp-request-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    currentEmail = document.getElementById('otp-email').value.trim().toLowerCase();
    if (!currentEmail) { showToast('Enter your email', 'error'); return; }

    const btn = document.getElementById('send-otp-btn');
    btn.disabled = true;
    document.getElementById('send-spinner').classList.remove('hidden');
    document.getElementById('send-icon').classList.add('hidden');

    try {
      const resp = await fetch('/api/auth/otp/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: currentEmail })
      });
      const data = await resp.json();
      if (resp.ok) {
        document.getElementById('sent-to-email').textContent = currentEmail;
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
        digits[0].focus();
        startCountdown(300);
        showToast('OTP sent! Check server logs in dev mode.', 'success');
      } else {
        showToast(data.error || 'Failed to send OTP', 'error');
        btn.disabled = false;
        document.getElementById('send-spinner').classList.add('hidden');
        document.getElementById('send-icon').classList.remove('hidden');
      }
    } catch(err) {
      showToast('Connection error', 'error');
      btn.disabled = false;
    }
  });

  document.getElementById('otp-verify-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const otp = getOtp();
    if (otp.length !== 6) { showToast('Enter all 6 digits', 'error'); return; }

    const btn = document.getElementById('verify-btn');
    btn.disabled = true;
    document.getElementById('verify-spinner').classList.remove('hidden');
    document.getElementById('verify-icon').classList.add('hidden');

    try {
      const resp = await fetch('/api/auth/otp/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email: currentEmail, otp })
      });
      const data = await resp.json();
      if (resp.ok) {
        localStorage.setItem('access_token', data.data.access_token);
        localStorage.setItem('refresh_token', data.data.refresh_token);
        localStorage.setItem('user', JSON.stringify(data.data.user));
        clearInterval(countdownInterval);
        showToast('OTP verified! Logging in...', 'success', 1500);
        setTimeout(() => window.location.href = '/dashboard', 1200);
      } else {
        showToast(data.error || 'Invalid OTP', 'error');
        digits.forEach(d => { d.value = ''; d.style.borderColor = 'var(--priority-high)'; });
        digits[0].focus();
        btn.disabled = false;
        document.getElementById('verify-spinner').classList.add('hidden');
        document.getElementById('verify-icon').classList.remove('hidden');
      }
    } catch(err) {
      showToast('Connection error', 'error');
      btn.disabled = false;
    }
  });

  async function resendOtp() {
    if (!currentEmail) return;
    await fetch('/api/auth/otp/send', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: currentEmail })
    });
    digits.forEach(d => { d.value = ''; d.style.borderColor = 'var(--border)'; });
    digits[0].focus();
    startCountdown(300);
    showToast('New OTP sent!', 'info');
  }

  function showToast(message, type = 'info', duration = 4000) {
    const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast-item ${type}`;
    toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span class="toast-msg">${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), duration);
  }
</script>
</body>
</html>

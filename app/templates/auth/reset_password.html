<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — IT Help Desk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">🔐</div>
      <div class="auth-title">New Password</div>
      <div class="auth-subtitle">Enter your new password below</div>
    </div>

    <form id="reset-form">
      <input type="hidden" id="token" value="{{ token }}">
      <input type="hidden" id="email" value="{{ email }}">

      <div class="form-group">
        <label class="form-label">New Password <span class="required">*</span></label>
        <div class="input-icon-wrap" style="position:relative;">
          <i class="input-icon fa-solid fa-lock"></i>
          <input type="password" class="form-control" id="new-password" placeholder="Min 8 characters" required>
          <button type="button" onclick="togglePwd()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;">
            <i class="fa-solid fa-eye" id="eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password <span class="required">*</span></label>
        <div class="input-icon-wrap">
          <i class="input-icon fa-solid fa-lock"></i>
          <input type="password" class="form-control" id="confirm-password" placeholder="Re-enter password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full" id="reset-btn">
        <i class="fa-solid fa-key"></i>
        Reset Password
      </button>
    </form>

    <p style="text-align:center; margin-top:20px; font-size:13px; color:var(--text-muted);">
      <a href="{{ url_for('web.login') }}" style="color:var(--brand-purple-glow);text-decoration:none;">
        <i class="fa-solid fa-arrow-left" style="font-size:11px;"></i> Back to Login
      </a>
    </p>
  </div>
</div>
<div id="toast-container"></div>

<script>
  if (localStorage.getItem('hd-theme') === 'light') document.body.classList.add('light-mode');

  function togglePwd() {
    const inp = document.getElementById('new-password');
    const ic = document.getElementById('eye');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    ic.className = inp.type === 'password' ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
  }

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const token = document.getElementById('token').value;
    const email = document.getElementById('email').value;
    const newPassword = document.getElementById('new-password').value;
    const confirm = document.getElementById('confirm-password').value;

    if (newPassword.length < 8) { showToast('Password must be at least 8 chars', 'error'); return; }
    if (newPassword !== confirm) { showToast('Passwords do not match', 'error'); return; }
    if (!token || !email) { showToast('Invalid reset link', 'error'); return; }

    const btn = document.getElementById('reset-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;"></span> Resetting...';

    try {
      const resp = await fetch('/api/auth/password/reset', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, email, new_password: newPassword })
      });
      const data = await resp.json();
      if (resp.ok) {
        showToast('Password reset! Redirecting to login...', 'success', 2000);
        setTimeout(() => window.location.href = '/login', 2000);
      } else {
        showToast(data.error || 'Reset failed. Try requesting a new link.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-key"></i> Reset Password';
      }
    } catch(err) {
      showToast('Connection error', 'error');
      btn.disabled = false;
    }
  });

  function showToast(m, t, d = 4000) {
    const c = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = `toast-item ${t}`;
    el.innerHTML = `<span class="toast-msg">${m}</span>`;
    c.appendChild(el);
    setTimeout(() => el.remove(), d);
  }
</script>
</body>
</html>

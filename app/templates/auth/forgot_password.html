<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your HelpDesk Pro password">
  <title>Forgot Password — HelpDesk Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
<canvas id="bg-canvas" style="position:fixed;inset:0;z-index:0;pointer-events:none;" aria-hidden="true"></canvas>
<div style="position:fixed;top:15%;left:10%;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,0.12) 0%,transparent 70%);pointer-events:none;z-index:0;animation:orb1 8s ease-in-out infinite;"></div>

<div class="auth-page" style="position:relative;z-index:1;">
  <div style="width:100%; max-width:440px; padding:16px;">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 20 20" fill="none">
            <rect x="2" y="2" width="7" height="7" rx="2" fill="white" opacity="0.9"/>
            <rect x="11" y="2" width="7" height="7" rx="2" fill="white" opacity="0.6"/>
            <rect x="2" y="11" width="7" height="7" rx="2" fill="white" opacity="0.6"/>
            <rect x="11" y="11" width="7" height="7" rx="2" fill="white" opacity="0.9"/>
          </svg>
        </div>
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your email and we'll send a reset link</p>
      </div>

      <div id="form-section">
        <form id="forgot-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email Address <span class="required">*</span></label>
            <div class="input-icon-wrap">
              <i class="input-icon fa-solid fa-envelope" aria-hidden="true"></i>
              <input type="email" class="form-control" id="email"
                     placeholder="you@company.com" required autofocus autocomplete="email">
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-full btn-lg" id="submit-btn" style="justify-content:center;">
            <span id="btn-spinner" class="spinner hidden" style="width:16px;height:16px;border-top-color:#fff;border-color:rgba(255,255,255,0.25);"></span>
            <i class="fa-solid fa-paper-plane" id="btn-icon"></i>
            Send Reset Link
          </button>
        </form>
      </div>

      <div id="success-section" class="hidden" style="text-align:center; padding:20px 0;">
        <div style="width:60px; height:60px; border-radius:50%; background:rgba(34,197,94,0.12); border:1px solid rgba(34,197,94,0.3); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:24px;">
          ✅
        </div>
        <div style="font-size:16px; font-weight:700; color:var(--text-primary); margin-bottom:8px;">Check your email!</div>
        <div style="font-size:13px; color:var(--text-secondary); line-height:1.7;">
          If an account exists for <strong id="sent-email"></strong>, we'll send a password reset link shortly.
        </div>
      </div>

      <div style="text-align:center; margin-top:20px;">
        <a href="{{ url_for('web.login') }}" style="color:var(--brand-glow); font-size:13px; text-decoration:none; display:inline-flex; align-items:center; gap:6px;">
          <i class="fa-solid fa-arrow-left" style="font-size:11px;"></i> Back to Sign In
        </a>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<style>
@keyframes orb1 {
  0%,100% { transform: translate(0,0) scale(1); }
  50%      { transform: translate(20px,-30px) scale(1.05); }
}
</style>
<script>
if (localStorage.getItem('hd-theme') === 'light') document.body.classList.add('light-mode');

document.getElementById('forgot-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email  = document.getElementById('email').value.trim();
  if (!email) { showToast('Please enter your email', 'error'); return; }

  const btn     = document.getElementById('submit-btn');
  const spinner = document.getElementById('btn-spinner');
  const icon    = document.getElementById('btn-icon');
  btn.disabled = true;
  spinner.classList.remove('hidden');
  icon.classList.add('hidden');

  try {
    const resp = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });

    document.getElementById('form-section').classList.add('hidden');
    document.getElementById('sent-email').textContent = email;
    document.getElementById('success-section').classList.remove('hidden');
  } catch(err) {
    showToast('Connection error. Please try again.', 'error');
    btn.disabled = false;
    spinner.classList.add('hidden');
    icon.classList.remove('hidden');
  }
});

function showToast(message, type) {
  const icons = { success: '✅', error: '❌', info: 'ℹ️' };
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast-item ${type}`;
  toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><div class="toast-body"><div class="toast-msg">${message}</div></div>`;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

// Particle background
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
const particles = Array.from({length:30}, () => ({
  x: Math.random()*canvas.width, y: Math.random()*canvas.height,
  r: Math.random()*1.5+0.5, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3, alpha: Math.random()*0.3+0.05
}));
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p => {
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(37,99,235,${p.alpha})`; ctx.fill();
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>canvas.width) p.vx*=-1;
    if(p.y<0||p.y>canvas.height) p.vy*=-1;
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
